<div class="recommendation-cover-slot">
  @if (book().coverImageUrl) {
    <img class="recommendation-cover" [src]="book().coverImageUrl" [alt]="book().title || ''" />
  }
</div>
<div class="recommendation-details">
  <p class="recommendation-title">{{ displayTitle() }}</p>
  <p class="recommendation-authors">{{ displayAuthors() }}</p>
  <p class="recommendation-price">{{ formattedPrice() }}</p>
  @if (googleAuth.user()) {
    <div class="add-to-cart-row">
      <button
        type="button"
        class="add-to-cart-button"
        [attr.aria-label]="language.translate('bookCard.addToCart')"
        (click)="cart.add(book())"
      >
        <svg
          class="action-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          role="img"
          [attr.aria-label]="language.translate('bookCard.addToCart')"
        >
          <circle cx="9" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
          <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.6L21 8H6" />
        </svg>
      </button>
      @if (cartQuantity() > 0) {
        <span class="cart-quantity-badge">{{ language.translate('bookCard.alreadyInCart', { count: cartQuantity() }) }}</span>
      }
    </div>
  }
</div>
