@if (recommendations().length > 0) {
  <section class="book-recommendations">
    <h2 class="recommendations-heading">{{ language.translate('cartPage.recommendationsHeading') }}</h2>

    <div class="recommendations-row">
      @if (hasMultiplePages()) {
        <button
          type="button"
          class="pagination-arrow"
          [attr.aria-label]="language.translate('bookSearch.previous')"
          [disabled]="!hasPreviousPage()"
          (click)="goToPreviousPage()"
        >
          <svg
            class="action-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="15 6 9 12 15 18" />
          </svg>
        </button>
      }

      <div class="recommendations-list">
        @for (book of visibleRecommendations(); track book) {
          <app-recommendation-card [book]="book" />
        }
      </div>

      @if (hasMultiplePages()) {
        <button
          type="button"
          class="pagination-arrow"
          [attr.aria-label]="language.translate('bookSearch.next')"
          [disabled]="!hasNextPage()"
          (click)="goToNextPage()"
        >
          <svg
            class="action-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="9 6 15 12 9 18" />
          </svg>
        </button>
      }
    </div>
  </section>
}
